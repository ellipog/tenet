pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroup('net.fabricmc')
                includeGroup('fabric-loom')
                // The no-remap plugin marker (net.fabricmc.fabric-loom.gradle.plugin) lives under
                // this group; without it the marker does not resolve (see the 26.3 toolchain spike).
                includeGroup('net.fabricmc.fabric-loom')
                // Loom's own transitive deps (unpick etc.) live under this group on the same maven;
                // without it they fall through to Central and 404.
                includeGroup('net.fabricmc.unpick')
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge'
                    url = uri('https://repo.spongepowered.org/repository/maven-public')
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

// This should match the folder name of the project, or else IDEA may complain (see https://youtrack.jetbrains.com/issue/IDEA-317606)
rootProject.name = 'tenet'
include('common')
include('fabric')
include('neoforge')

// ---------------------------------------------------------------------------
// Armature is consumed as a published artefact, not as an included build.
//
// This started as "includeBuild('../armature')" with dependency substitution, which is the
// tidier arrangement when it works: no publish step, no version bump between repos. It did
// not work here. Substituting Armature's modules onto its projects put Loom's and
// ModDevGradle's variant attributes up against this build's, and resolution failed with
// "no matching variant" for reasons that were about build tooling rather than about anything
// in either mod.
//
// So Tenet depends on "dev.ellipog:armature-common-<mc>:<version>", resolved from Maven
// local, which armature publishes. That is also exactly how the real release works -- from
// Modrinth or CurseForge, as a required dependency -- so the development path and the shipped
// path are the same shape. See _deploy.ps1, which orders the two steps so it cannot be got
// wrong by hand.
//
// Armature's own loader projects (:fabric, :neoforge) are not needed by this build at all:
// Tenet names only classes from Armature's common API. Its jars arrive at runtime as mods.
// ---------------------------------------------------------------------------
