# Tagged releases and manual builds for Tenet.
#
# Two triggers and nothing else, deliberately: no run on an ordinary push or a pull request. A
# release is a decision (a tag) or a button press, not a side effect of committing. Releases are
# stable since 1.0.0 -- `prerelease: false` below is the line to flip back if a pre-release is
# ever wanted.
#
# Armature has to be released before this runs: Tenet compiles against the artefact Armature's own
# release workflow publishes to maven.ellipog.dev, and this checks that `armature_version` is there
# before building rather than letting it fail later as an unresolved coordinate.
name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A test JVM that keeps a server thread alive would otherwise run to GitHub's 6-hour cap.
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # The tag and the built version have to name the same version, and Armature's version has to
      # come out of the same file -- it is the tag the next step checks out. A jar called
      # `tenet-fabric-1.21.1-0.1.0.jar` published under tag v0.1.1 is a release whose download does
      # not match its name, and nothing else here would notice. Runs before the build, so a mismatch
      # fails in seconds instead of after twenty minutes.
      - name: Resolve the versions and check the tag against them
        id: version
        run: |
          set -euo pipefail
          read_version() { sed -n "s/^$1=//p" gradle.properties | tr -d '\r' | head -n 1; }
          version="$(read_version version)"
          armature_version="$(read_version armature_version)"
          minecraft_version="$(read_version minecraft_version)"
          if [ -z "$version" ]; then
            echo "::error::no version= line in gradle.properties"
            exit 1
          fi
          if [ -z "$armature_version" ]; then
            echo "::error::no armature_version= line in gradle.properties"
            exit 1
          fi
          if [ -z "$minecraft_version" ]; then
            echo "::error::no minecraft_version= line in gradle.properties"
            exit 1
          fi
          tag="v$version"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version=$version in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "armature_version=$armature_version" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$minecraft_version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # A static bucket will happily overwrite a published version, and then every consumer's cache
      # disagrees with every other one about what "0.1.1" means -- a real repository refuses, and this
      # is the same refusal one HEAD request deep, before the build rather than after it.
      - name: Refuse to publish a version that already exists
        env:
          BASE: https://maven.ellipog.dev
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          mc='${{ steps.version.outputs.minecraft_version }}'
          for artifact in tenet-common tenet-fabric tenet-neoforge; do
            url="$BASE/dev/ellipog/${artifact}-${mc}/${version}/${artifact}-${mc}-${version}.pom"
            # `|| { ... }` rather than relying on `set -e`: an assignment whose command substitution
            # fails aborts the step with curl's own exit code and no output at all, and "exit code 6"
            # is not something anybody can act on. A repository that cannot be reached is a different
            # fault from a version that is already published, and it says so.
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url")" || {
              echo "::error::could not reach $url (curl exit $?)"
              exit 1
            }
            case "$code" in
              404) echo "not published yet: ${artifact}-${mc} ${version}" ;;
              200) echo "::error::${artifact}-${mc} ${version} is already published at $url"
                   echo "Published versions are permanent. Bump version= in gradle.properties and tag again."
                   exit 1 ;;
              *)   echo "::error::could not check $url (HTTP $code)"
                   exit 1 ;;
            esac
          done

      # The credentials and the bucket, checked before the twenty-minute build rather than after it,
      # with rclone's own words in the annotation. See armature's copy: "Access Denied" reads the same
      # for a wrong key, an absent key and a key with a typo in its name.
      - name: Check the upload credentials
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          # Secrets are pasted, and a pasted value carries a trailing space or newline often enough to
          # plan for. One did: the account id arrived with a trailing space, which made the endpoint
          # `https://<id> .r2.cloudflarestorage.com` and produced "Custom endpoint ... was not a valid
          # URI" -- a message that reads as a wrong key rather than as a stray space. Trimmed here, so
          # a whitespace-only value is also caught by the emptiness check below rather than surviving
          # it as a malformed URL.
          export RCLONE_CONFIG_R2_ACCESS_KEY_ID="$(printf '%s' "${RCLONE_CONFIG_R2_ACCESS_KEY_ID:-}" | tr -d '[:space:]')"
          export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$(printf '%s' "${RCLONE_CONFIG_R2_SECRET_ACCESS_KEY:-}" | tr -d '[:space:]')"
          export RCLONE_CONFIG_R2_ENDPOINT="$(printf '%s' "${RCLONE_CONFIG_R2_ENDPOINT:-}" | tr -d '[:space:]')"
          missing=0
          for name in RCLONE_CONFIG_R2_ACCESS_KEY_ID RCLONE_CONFIG_R2_SECRET_ACCESS_KEY RCLONE_CONFIG_R2_ENDPOINT; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is empty"
              missing=1
            fi
          done
          if [ "$missing" != 0 ]; then
            echo "Set R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and R2_ACCOUNT_ID as repository secrets on ellipog/tenet."
            exit 1
          fi
          if ! command -v rclone >/dev/null; then
            curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o rclone.zip
            unzip -q -o rclone.zip
            sudo install -m 0755 rclone-*-linux-amd64/rclone /usr/local/bin/rclone
          fi
          # `sed -n 1p` rather than `head -n 1`: head closes the pipe, rclone dies of SIGPIPE, and
          # pipefail turns a one-line banner into a failed release.
          rclone version | sed -n 1p
          rclone listremotes
          if ! out="$(rclone lsf R2:ellipog-maven 2>&1)"; then
            escaped="$(printf '%s' "$out" | head -c 1200 | sed 's/%/%25/g; s/\r//g' | awk '{ printf "%s%%0A", $0 }')"
            echo "::error::rclone could not list the bucket: ${escaped}"
            exit 1
          fi
          echo "the bucket is reachable"

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Tenet compiles against a *published* Armature, not its source tree, so the version this repo
      # declares has to exist on the repository -- otherwise the failure arrives much later as a
      # resolution error naming a coordinate, which does not say that the version was never released.
      # One request, and it names which of the two numbers is wrong.
      - name: Check Armature is published at the version Tenet compiles against
        env:
          BASE: https://maven.ellipog.dev
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.armature_version }}'
          mc='${{ steps.version.outputs.minecraft_version }}'
          url="$BASE/dev/ellipog/armature-common-${mc}/${version}/armature-common-${mc}-${version}.pom"
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$url")" || {
            echo "::error::could not reach $url (curl exit $?)"
            exit 1
          }
          if [ "$code" != "200" ]; then
            echo "::error::Armature $version is not published (HTTP $code at $url)"
            echo "Release Armature first: bump its version, push the tag, and let its workflow publish."
            exit 1
          fi
          echo "Armature $version is published: $url"

      # `build` includes `check` includes `test`, so the suite runs here without being named and a
      # failing test stops the release -- the same rule the local deploy script follows. The log is
      # kept in a file as well as the console so the next step can read it.
      - name: Build with Gradle
        run: |
          set -o pipefail
          ./gradlew build --console=plain 2>&1 | tee "$RUNNER_TEMP/tenet.log"

      # A failed build's reason, in the run's own summary and annotations rather than only in a log
      # nobody opens. Both Gradle logs are read, because the Armature publish above can be the step
      # that fails -- and when it is, the interesting error is in *its* output, not in this one's.
      - name: Report what the build said
        if: failure()
        run: |
          {
            echo '### The build failed, and Gradle said'
            for log in "$RUNNER_TEMP/armature.log" "$RUNNER_TEMP/tenet.log"; do
              [ -f "$log" ] || continue
              echo "#### $(basename "$log") (tail)"
              echo '```'
              tail -n 80 "$log"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          for log in "$RUNNER_TEMP/armature.log" "$RUNNER_TEMP/tenet.log"; do
            [ -f "$log" ] || continue
            # Everything Gradle writes between these two markers is the fault. One annotation carries
            # it whole -- newlines escaped, because the run UI keeps only the first ten annotations --
            # and the first few lines are repeated one per annotation so they read without expanding.
            block="$(sed -n '/FAILURE: Build failed with an exception/,/^BUILD FAILED/p' "$log" | head -n 60 | cut -c1-500)"
            if [ -z "$block" ]; then
              block="$(tail -n 60 "$log" | cut -c1-500)"
            fi
            escaped="$(printf '%s\n' "$block" | sed 's/%/%25/g; s/\r//g' | awk '{ printf "%s%%0A", $0 }')"
            echo "::error::$(basename "$log") said: ${escaped}"
            printf '%s\n' "$block" | head -n 8 | cut -c1-320 | sed 's/%/%25/g; s/\r//g' \
              | while IFS= read -r line; do if [ -n "$line" ]; then echo "::error::$line"; fi; done
          done
          exit 0

      # The loader jars only, for the *release assets*: those are what a player installs, and a
      # non-mod jar in a `mods` folder is what makes Fabric refuse the whole folder ("Found 2
      # non-fabric mods") -- see the note in .utils/deploy.ps1. `tenet-common` is the API a handler
      # mod compiles against, so it goes to the Maven below instead, where nothing installs it by
      # accident.
      #
      # Named rather than found with `find . -path '*/build/libs/*.jar'`, which also matches
      # `buildSrc/build/libs/buildSrc.jar` and would pick up the Maven tree under `build/repo`.
      # Loom's unremapped dev jar lives in `build/devlibs`, which is never read here; the `-dev.jar`
      # exclusion is kept as a guard for a loader that changes it.
      - name: Collect the release jars
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          mkdir -p dist
          for sub in fabric neoforge; do
            [ -d "$sub/build/libs" ] || continue
            find "$sub/build/libs" -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-javadoc.jar' \
              -exec cp {} dist/ \;
          done
          ls -la dist
          jars=(dist/*.jar)
          if [ ! -f "${jars[0]}" ]; then
            echo "::error::no jars were collected"
            exit 1
          fi
          for jar in "${jars[@]}"; do
            case "$jar" in
              *"-${version}.jar") ;;
              *) echo "::error::unexpected jar in the release set: $jar"; exit 1 ;;
            esac
          done

      - name: Upload the jars as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: tenet-${{ steps.version.outputs.tag }}
          path: dist/*.jar
          if-no-files-found: error

      # -- maven.ellipog.dev ----------------------------------------------------------------
      #
      # Tenet's API for a *handler mod*: the docs already describe a pack shipping one as an
      # optional dependency, and registering a custom task or reward type means compiling against
      # CustomTasks.Handler, TenetScripts and TenetEvents. All three modules go up, so a handler
      # mod's dev run can resolve the loader jars too. A KubeJS pack needs none of this -- scripts
      # register the same handlers through the plugin KubeJS finds inside this jar.
      - name: Publish the Maven tree
        run: ./gradlew publishToLocalRepo --console=plain

      - name: Upload it to maven.ellipog.dev
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          set -euo pipefail
          # rclone was installed by the credentials check above, which is why this does not install it
          # a second time. The credentials are trimmed for the same reason they are there (see that
          # step): a trailing space in a pasted secret is an invalid URI, not a wrong key.
          export RCLONE_CONFIG_R2_ACCESS_KEY_ID="$(printf '%s' "${RCLONE_CONFIG_R2_ACCESS_KEY_ID:-}" | tr -d '[:space:]')"
          export RCLONE_CONFIG_R2_SECRET_ACCESS_KEY="$(printf '%s' "${RCLONE_CONFIG_R2_SECRET_ACCESS_KEY:-}" | tr -d '[:space:]')"
          export RCLONE_CONFIG_R2_ENDPOINT="$(printf '%s' "${RCLONE_CONFIG_R2_ENDPOINT:-}" | tr -d '[:space:]')"
          #
          # `copy`, never `sync`. Sync deletes whatever is at the destination and is not in the
          # source -- which here is every version ever published, Armature's included, because both
          # repos publish into one bucket. One word, one command, and the whole repository is gone.
          #
          # A published version can never change, so those files are cached for a year. The
          # `maven-metadata.xml` beside them *does* change -- it gains a version on every release --
          # so it is uploaded separately, with a short life, and excluded from the long one.
          #
          # Output is captured rather than streamed so that a failure can carry rclone's own words
          # into an annotation; a run's log is not readable from outside.
          upload() {
            local out
            # `--s3-no-check-bucket` is not optional: rclone's S3 backend checks the bucket exists
            # -- and creates it if not -- before an upload, and the token is deliberately scoped to
            # one bucket's objects, so that check answers "S3: CreateBucket ... AccessDenied".
            if ! out="$(rclone copy build/repo R2:ellipog-maven --s3-no-check-bucket "$@" -v 2>&1)"; then
              local escaped
              escaped="$(printf '%s' "$out" | tail -c 2000 | sed 's/%/%25/g; s/\r//g' | awk '{ printf "%s%%0A", $0 }')"
              echo "::error::rclone copy failed: ${escaped}"
              exit 1
            fi
            echo "$out" | tail -n 5
          }
          upload --exclude "maven-metadata.xml*" \
            --header-upload "Cache-Control: public, max-age=31536000, immutable" \
            --no-traverse
          upload --include "maven-metadata.xml*" \
            --header-upload "Cache-Control: public, max-age=300" \
            --no-traverse

      # An upload reporting success and the artifact being *fetchable* are two different claims, and
      # only the second one matters to the handler mod that is about to depend on it.
      - name: Check it is actually being served
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          mc='${{ steps.version.outputs.minecraft_version }}'
          url="https://maven.ellipog.dev/dev/ellipog/tenet-common-${mc}/${version}/tenet-common-${mc}-${version}.pom"
          for attempt in 1 2 3 4 5; do
            if curl -sf -o /dev/null --max-time 30 "$url"; then
              echo "served: $url"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$url is not being served after the upload"
          exit 1

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*.jar
          body: |
            Install `tenet-fabric-*.jar` on Fabric, or `tenet-neoforge-*.jar` on NeoForge.

            **Armature is required on both loaders** -- install it alongside Tenet; the loader names
            it if it is missing.
