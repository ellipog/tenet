modLoader = "javafml" #mandatory
loaderVersion = "${neoforge_loader_version_range}" #mandatory
license = "${license}" # Review your options at https://choosealicense.com/.
issueTrackerURL="https://github.com/ellipog/tenet/issues" #optional
[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "${mod_name}" #mandatory
logoFile="assets/tenet/icon.png" #optional (the icon the mod list shows)
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional (see https://docs.neoforged.net/docs/misc/updatechecker/)
displayURL="https://ellipog.dev" #optional (displayed in the mod UI)
credits="${credits}" #optional
authors = "${mod_author}" #optional
description = '''${description}''' #mandatory (Supports multiline text)
# Armature is required, not optional. NeoForge will refuse to load Tenet without it and say
# so by name, which is the failure we want: the alternative is a NoClassDefFoundError naming
# a class the player has never heard of.
[[dependencies.${mod_id}]]
modId = "armature"
type = "required"
versionRange = "[${armature_version},)"
ordering = "AFTER"
side = "BOTH"
[[dependencies.${mod_id}]] #optional
modId = "neoforge" #mandatory
type="required" #mandatory (Can be one of "required", "optional", "incompatible" or "discouraged")
versionRange = "[${neoforge_version},)" #mandatory
ordering = "NONE" # The order that this dependency should load in relation to your mod, required to be either 'BEFORE' or 'AFTER' if the dependency is not mandatory
side = "BOTH" # Side this dependency is applied on - 'BOTH', 'CLIENT' or 'SERVER'
[[dependencies.${mod_id}]]
modId = "minecraft"
type="required" #mandatory (Can be one of "required", "optional", "incompatible" or "discouraged")
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# KubeJS is optional, and this entry exists so the game says so rather than leaving a pack author to
# guess: Tenet runs without it, and with it the plugin in this module is loaded (see
# TenetKubeJsPlugin) and scripts can drive stages, listen to quest events, and register custom task
# and reward handlers. Nothing requires KubeJS to be present to build or to run.
#
# The floor follows the pin: KubeJS's 26.x line versions nothing like its 1.21 line (26.1.2-8.0.6
# sorts below the old 2101.7.2 floor, so that floor refuses the very version this branch builds
# against), and the pinned version is the only 26.x line this branch has verified. Moving the pin
# below carries the floor with it.
[[dependencies.${mod_id}]]
modId = "kubejs"
type = "optional"
versionRange = "[${kubejs_version},)"
ordering = "AFTER"
side = "BOTH"

# The recipe viewers, all optional and all client-only: the adapters live in this mod
# (client/viewer), and a client with none of them loses nothing. Declared here so a pack author
# reading Tenet's own mod list can see the integration is meant to be there rather than infer it.
[[dependencies.${mod_id}]]
modId = "emi"
type = "optional"
versionRange = "[1.1.0,)"
ordering = "AFTER"
side = "CLIENT"
[[dependencies.${mod_id}]]
modId = "jei"
type = "optional"
versionRange = "[19,)"
ordering = "AFTER"
side = "CLIENT"
[[dependencies.${mod_id}]]
modId = "roughlyenoughitems"
type = "optional"
versionRange = "[16,)"
ordering = "AFTER"
side = "CLIENT"

# The one mixin this mod carries: four getters over the open container's live panel corner
# and size, client-only, so an inventory-anchored button keeps its gap outside a taller or wider
# panel instead of being swallowed by it. See ContainerPanelAccessor for why recomputing stops
# working the moment panels stop being constants.
[[mixins]]
config = "tenet.mixins.json"

# Features are specific properties of the game environment, that you may want to declare you require. This example declares
# that your mod requires GL version 3.2 or higher. Other features will be added. They are side aware so declaring this won't
# stop your mod loading on the server for example.
#[features.${mod_id}]
#openGLVersion="[3.2,)"
