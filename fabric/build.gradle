plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}
// No KubeJS here, and it is not an omission: KubeJS 7 -- the 1.21 line -- is NeoForge-only. The Fabric
// artifact on its maven (`dev.latvian.mods:kubejs-fabric`) stops at 2001.* (1.20.1), while
// `kubejs-neoforge` continues through 2101.* and beyond. So the scripting integration lives in
// :neoforge alone, and `:common`'s `api/TenetScripts` -- which names none of KubeJS's types -- is the
// half that would be reused if a Fabric KubeJS ever returns.
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // No mappings block: 26.x is unobfuscated (official Mojang names are the names), and Loom
    // refuses layered mappings in a non-obfuscated environment.
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // No separate creative-tab pin: the 26.3 aggregator bundles fabric-creative-tab-api-v1
    // (which owns CreativeModeTabEvents, the hook TenetFabric uses), and the old
    // fabric-item-group-api-v1 module is gone from it — pinning it separately compiles but
    // is absent in production and crashes boot, besides conflicting with the aggregator's
    // own CreativeModeTab mixins in dev.

    // Armature's common API. Declared here too, and not inherited from :common, because
    // compileOnly does not travel through apiElements -- and this project's sources genuinely
    // use it: the client entry point registers a screen and a key through Armature's API.
    //
    // No Armature *mod* dependency, and none is wanted. Armature's Fabric jar supplies its own
    // common classes at runtime and is loaded as a separate mod, so Tenet only ever needs
    // those classes to compile against.
    compileOnly "dev.ellipog:armature-common-${minecraft_version}:${armature_version}"

    // But a dev *run* is a real game with a real mod loader, and Tenet's fabric.mod.json requires
    // Armature -- so without this the first thing a dev server does is refuse to start: "Mod tenet
    // requires armature ${armature_version} or above". The NeoForge module carries the same line
    // for the same reason; this is the Fabric half.
    //
    // With it, a dev run gets one step further and stops on Fabric API's *own* access widener:
    // "Namespace (intermediary) does not match current runtime namespace (named)". That is the dev
    // toolchain's business rather than this mod's -- it happens while the loader reads Fabric API's
    // jar, before Tenet is constructed -- and it does not affect a deployed profile, where the
    // runtime namespace is intermediary.
    runtimeOnly "dev.ellipog:armature-fabric-${minecraft_version}:${armature_version}"
}

// ---------------------------------------------------------------------------
// The UI tour: a Fabric client gametest that drives a real client and photographs the book,
// the HUD and the editor, the way The Desert Dimension photographs its terrain. It needs no
// window focus -- input is simulated inside the game -- so it runs while you work. See
// src/gametest/java/.../TenetUiTour.java for the script it reads.
//
//     gradlew :fabric:runClientGameTest
//
// Screenshots land in fabric/build/run/clientGameTest/screenshots.
// ---------------------------------------------------------------------------
fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'tenet-gametest'
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

// Every run starts from a fresh world, a fresh screenshot folder and the worked questline, so a
// screenshot always shows this build drawing tools/quests and nothing left over from last time.
tasks.configureEach {
    if (name == 'runClientGameTest') {
        doFirst {
            def runDir = file('build/run/clientGameTest')
            ['saves', 'screenshots', 'config/tenet'].each {
                def dir = new File(runDir, it)
                if (dir.exists() && !dir.deleteDir()) {
                    throw new GradleException("could not delete ${dir}; stop the previous client game test first")
                }
            }
            copy {
                from rootProject.file('tools/quests')
                into new File(runDir, 'config/tenet/quests')
                exclude '_schema/**'
            }
            def client = new File(runDir, 'config/tenet/client.json')
            client.text = '{"guideSeen":true}\n'
            new File(runDir, 'config/tenet/pinned.json').text = '{"pins":["punch_a_tree","make_a_table"]}\n'
        }
    }
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
