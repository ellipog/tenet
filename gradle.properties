# Armature
## The version Tenet compiles against and declares as a required dependency. Published to
## https://maven.ellipog.dev by armature's release workflow and resolved from there, so this repo
## builds from a clone with nothing beside it. A local publish still wins during development --
## mavenLocal is declared first in buildSrc/src/main/groovy/multiloader-common.gradle -- which is how
## a change to Armature can be built against before it is released.
##
## Kept equal to Armature's version, and Armature has to be released first: this repo's release
## workflow asks the repository whether <armature_version> is there before it builds, and says so in
## that sentence rather than failing later with a resolution error naming a coordinate.
##
## The floor follows the pin. Both metadata files declare Armature as required --
## ">=${armature_version}" on Fabric, "[${armature_version},)" on NeoForge -- so an Armature too
## old to have a method this repo calls is named by the loader as a missing dependency, rather
## than arriving as a NoSuchMethodError on the first tick after somebody joins. No separate edit:
## moving the pin below carries the floor with it, which is the whole point of the placeholder.
## A bump that adds a cross-mod call (0.2.0 calls `button.sprite()`) therefore raises the floor
## by construction; a bump that adds none still moves it, because a floor below the pin promises
## combinations that were never built or tested.
##
## Bumped 0.1.1 -> 0.1.2 to keep the "equal to Armature's version" rule true: Armature's own
## `gradle.properties` had read `version=0.1.2` while this pin still said 0.1.1, so a local build
## compiled this repo against the *previous* Armature and any API added since was invisible -- which is
## exactly how it failed, with "cannot find symbol" naming a class that is present in the source tree.
## (History: the floor used to be pinned at 0.1.1 while the pin moved. That ended at 0.2.0, whose
## picker calls `button.sprite()` -- an Armature older than the pin would load beside this repo and
## crash on first draw, which is exactly what the floor exists to refuse.)
##
## Bumped 0.1.2 -> 0.1.3 with both projects, for the same rule. Note the ordering this imposes on a
## release: Armature's 0.1.3 has to reach the maven this resolves against before Tenet's 0.1.3 builds,
## because this line is what the local build compiles *against*. A release that publishes Tenet first
## fails at compile rather than at runtime, which is the good direction for it to fail.
##
## Bumped 0.1.3 -> 0.1.4 with both projects, for the same rule and with the same ordering, which the
## release workflows now enforce rather than merely document: Armature's workflow publishes 0.1.4 to
## maven.ellipog.dev, and Tenet's refuses to build until that coordinate answers.
##
## Bumped 0.1.4 -> 0.1.5 with both projects, same rule, same ordering.
## Bumped 0.1.5 -> 0.2.0 with both projects, same rule, same ordering.
## Bumped 0.2.0 -> 0.2.1 with both projects: Armature's energy seam (api.energy) is new API,
## and this repo reads it -- same rule, same ordering.
## Bumped 0.2.1 -> 0.2.2 with both projects: Armature's BLOCK_BROKEN event (api.event) is new
## API, and Tenet's break task listens to it -- same rule, same ordering.
## Bumped 0.2.2 -> 1.0.0 with both projects: first stable release, same rule, same ordering.
armature_version=1.1.0

# The recipe viewers, for the adapters under client/viewer/.
#
# Pinned in one place, and all `compileOnly`: none reaches a jar or the published POM, and a
# client without any of them loses nothing. JEI publishes a loader-neutral artefact on official
# Mojang names, which is the only kind of thing common/ can compile; REI publishes no such common
# artefact, so its NeoForge API jar is the one both loader projects read.
#
# EMI is GONE on this branch: no 26.x EMI artifact exists anywhere (latest is 1.1.24 for 1.21.1),
# so the EMI adapter, its pin and its check entry went with the port -- JEI and REI cover. When EMI
# ports to 26.x, re-add all three (kept as one revertable commit for exactly this).
jei_version=31.12.0.65
rei_version=26.3.824

# Tests. JUnit 5, via the BOM so the platform and jupiter versions cannot drift apart.
junit_version=5.10.2

# KubeJS. `compileOnly` in :neoforge, for the scripting plugin's class and nothing else -- and
# NeoForge only (the Fabric artifact stops at 1.20.1 while `kubejs-neoforge` continues). KubeJS 8
# is the 26.x line; 26.1.2-8.0.6 is the newest published (no 26.3 yet) -- the build verifies
# whether the plugin still compiles against it. The shared half of the integration
# (api/TenetScripts) names none of its types, so it is reusable if that ever changes.
kubejs_version=26.1.2-8.0.6

# NeoForge. 26.3.0.76 current stable: the version here is also the floor the mod declares in
# neoforge.mods.toml, so this is the NeoForge a pack must run.
neoforge_version=26.3.0.76
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Loom for 26.x resolves only on a 25+ JVM -- same arrangement as armature's mc-26.3 branch:
# a path on this machine, committed, because CI sets up its own JDK and main keeps running on 21.

