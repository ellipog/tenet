plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    // withJavadocJar() is deliberately absent -- see the same note in armature's copy. It is a
    // jar nobody opens, it floods the build with warnings, and it once failed outright on a
    // stale file from a killed build.
}

repositories {
    mavenCentral()

    // Armature, during local development.
    //
    // Tenet compiles against Armature's published artefact rather than its source tree: the
    // composite-build substitution the plan originally called for turned out to fight
    // Loom's and ModDevGradle's variant attributes, and the plan itself named this as the
    // fallback. _deploy.ps1 runs "gradlew :common:publishToMavenLocal" in armature before
    // building task here, so the ordering cannot be got wrong by hand.
    //
    // Filtered to dev.ellipog on purpose: a bare mavenLocal() would shadow every other
    // dependency in this build with whatever happens to be sitting in ~/.m2.
    maven {
        name = 'ArmatureLocal'
        url = mavenLocal().url
        content { includeGroup('dev.ellipog') }
    }

    // The same artefacts as everybody else gets them. Armature's release workflow publishes to
    // https://maven.ellipog.dev on every tag, so this repo builds from a clone and nothing else --
    // no sibling checkout to find, nothing to publish first, and no way for the two to disagree
    // about which Armature is being compiled against.
    //
    // Declared *after* ArmatureLocal on purpose: a locally published version still wins during
    // development, which is what makes it possible to build against an Armature change before that
    // change has been released at all.
    maven {
        name = 'Ellipog'
        url = 'https://maven.ellipog.dev'
        content { includeGroup('dev.ellipog') }
    }

    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    // (A ParchmentMC repository block lived here until the 26.3 port: 26.x is unobfuscated and
    // Parchment publishes nothing for it, so there is nothing left to resolve from it.)
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }

    // -------------------------------------------------------------------------
    // The two repositories the recipe-viewer adapters need. The third viewer's
    // artefacts are already covered by BlameJared above.
    //
    // TerraformersMC answers and then redirects to the same maintainer's newer
    // host; Gradle follows the redirect, and the coordinate is the one the
    // viewer's own README documents for a multi-loader project.
    // -------------------------------------------------------------------------
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
}

// ---------------------------------------------------------------------------
// The two viewer APIs, for the adapters under client/viewer/.
//
// Same rule as Armature's parties adapters: `compileOnly`, so none of them reaches a jar, the
// published POM, or a consumer's classpath -- and a client without any of them loses nothing. This
// is also what keeps a class-loading failure impossible: only the adapter files under
// client/viewer/ name these packages, and `.utils/check_integration.py` fails the build if anything
// else ever does.
//
// JEI's `common-api` is the whole API package, no dependencies, no loader types at all. REI has no
// loader-neutral mojmap artefact, so its NeoForge API jar is the compile target for both loader
// projects: common/ reads official names, and the Fabric module remaps its output to intermediary
// on the way into the jar. (EMI was the third until the 26.3 port removed it: no 26.x EMI artifact
// exists, so its adapter, pin and check entry went with it -- see that commit.)
//
// No `testImplementation` here: no test constructs an adapter -- everything decidable is pushed
// into QuestContent and ItemQuestIndex, which name no viewer -- so putting a viewer jar on the
// test runtime classpath would only make it easier to break that rule.
// ---------------------------------------------------------------------------
dependencies {
    compileOnly "mezz.jei:jei-26.3-common-api:${jei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    // Note: armature_version is new here. Tenet's metadata declares Armature as a required
    // dependency, so the version has to be expanded into fabric.mod.json and neoforge.mods.toml
    // -- and every field used in those files must appear in this map.
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'armature_version'             : armature_version,
            'kubejs_version'               : kubejs_version,
            'credits'                      : credits,
            'java_version'                 : java_version
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        // The Maven tree the release workflow uploads to maven.ellipog.dev -- see the same block in
        // armature's copy for the full reasoning. `gradlew publishToLocalRepo` is the one command.
        //
        // Tenet's API is published for a *handler mod*: the docs already describe a pack shipping
        // "a handler mod as an optional dependency", and registering a custom task or reward type
        // means compiling against CustomTasks.Handler, TenetScripts and TenetEvents. A KubeJS pack
        // needs none of this -- scripts register the same handlers through the plugin, which KubeJS
        // finds inside this jar.
        //
        // The root project's build directory, not this project's: this convention runs in every
        // subproject, and `layout.buildDirectory` would write one module into each of
        // common/build/repo, fabric/build/repo and neoforge/build/repo -- three trees, each holding a
        // third of a repository, where the upload wants one.
        maven {
            name = 'localRepo'
            url = rootProject.layout.buildDirectory.dir('repo')
        }

        // A hand-run push somewhere else, when local_maven_url is set. Only declared when there is a
        // URL: a repository with a null url is one Gradle cannot publish to, and leaving it in the
        // list made `publish` a landmine rather than an omission.
        def remote = System.getenv('local_maven_url')
        if (remote) {
            maven {
                name = 'external'
                url = remote
            }
        }
    }
}
