plugins {
    // see https://fabricmc.net/develop/ for new versions. 26.x is unobfuscated, so this is the
    // no-remap plugin id; modImplementation/modCompileOnly/remapJar do not exist here -- the
    // standard implementation/compileOnly/jar configurations are used instead (see fabric/build.gradle
    // and the deploy tasks below).
    id 'net.fabricmc.fabric-loom' version '1.17.21' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

// ---------------------------------------------------------------------------
// Local test deploy.
//
// Copies the built jars straight into the Modrinth App profiles named in
// gradle.properties, so testing is one command. Each task deletes the previous
// copies first -- otherwise an old jar sits next to the new one and Minecraft
// loads whichever it happens to pick.
// ---------------------------------------------------------------------------

def archivePrefix = mod_id

def registerDeploy = { String taskName, String subproject, String jarTask, String dirProperty ->
    def configured = project.findProperty(dirProperty)
    def sub = project.project(":${subproject}")

    tasks.register(taskName) {
        group = 'deploy'
        description = "Build :${subproject} and copy the resulting jar into ${dirProperty}."
        dependsOn "${subproject}:${jarTask}"

        doLast {
            if (configured == null) {
                throw new GradleException("${dirProperty} is not set in gradle.properties")
            }

            // Resolved here rather than where the task is registered, and that is not tidiness. This
            // is a path on *this* machine, and `project.file()` on a Windows path containing a space
            // throws URISyntaxException -- on Linux, during *configuration*, which fails every task
            // in the build rather than only this one. See armature/build.gradle, where the same line
            // cost a CI run: "Mod Testing Fabric 1.21.1" has a space in it and the runner could not configure.
            def modsDir = project.file(configured)

            def built = sub.tasks.named(jarTask).get().archiveFile.get().asFile
            if (!built.exists()) {
                throw new GradleException("No jar at ${built} -- did :${subproject}:${jarTask} run?")
            }

            modsDir.mkdirs()

            def stale = modsDir.listFiles(new FilenameFilter() {
                boolean accept(File dir, String name) {
                    return name.startsWith(archivePrefix + '-') && name.endsWith('.jar')
                }
            })
            stale?.each {
                println "deploy: removing old ${it.name}"
                if (!it.delete()) {
                    logger.warn("deploy: could not delete ${it}")
                }
            }

            def target = new File(modsDir, built.name)
            try {
                java.nio.file.Files.copy(built.toPath(), target.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                println "deploy: ${built.name} -> ${target}"
            }
            catch (java.nio.file.FileSystemException e) {
                // See armature/build.gradle for the full reasoning. In short: a jar something has open
                // cannot be replaced, that is a normal condition rather than a broken build, and
                // failing here would also stop the test combos being updated -- which are the thing
                // that does not care whether the game is running.
                //
                // "Something", not "Minecraft": this has been observed with no java.exe running at all.
                // The wording points at check_deploy.py instead of guessing, because that is what
                // actually establishes whether the profile received the new jar.
                logger.warn("deploy: SKIPPED ${target.name}")
                logger.warn("deploy:   ${e.reason ?: 'the file is locked'}")
                logger.warn("deploy:   ${target}")
                logger.warn("deploy:   Something is holding this file open -- usually Minecraft, and not")
                logger.warn("deploy:   necessarily. Close the game and anything else that has scanned the")
                logger.warn("deploy:   folder, then re-run. The test combos are deployed either way, and")
                logger.warn("deploy:   check_deploy.py says whether this profile actually got the new jar.")
            }
        }
    }
}

registerDeploy('deployFabric',   'fabric',   'jar', 'testModsDirFabric')
registerDeploy('deployNeoForge', 'neoforge', 'jar',      'testModsDirNeoForge')

tasks.register('deployAll') {
    group = 'deploy'
    description = 'Deploy to both the Fabric and the NeoForge test profile.'
    dependsOn 'deployFabric', 'deployNeoForge'
}

// ---------------------------------------------------------------------------
// The Maven tree for the release workflow.
//
// `publishAllPublicationsToLocalRepoRepository` is the task Gradle generates for the `localRepo`
// repository, once per subproject. This is the name that says what it does, and it exists so the
// workflow does not have to know Gradle's spelling. See armature's copy for the long version.
//
// Every module, not `:common` alone: a handler mod's dev run resolves tenet-fabric or
// tenet-neoforge, while compiling against tenet-common is what registering a task type needs.
// ---------------------------------------------------------------------------
tasks.register('publishToLocalRepo') {
    group = 'publishing'
    description = 'Publishes every module into build/repo, a Maven tree ready to upload.'
    dependsOn {
        subprojects.collect { "${it.path}:publishAllPublicationsToLocalRepoRepository" }
    }
}
